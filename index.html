<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1522">
<title>深度资讯</title>
<style>
  :root{
    --bg:#0f1522; --card:#161d2d; --text:#e8ecf4; --muted:#8b94a8;
    --accent:#7c74ff; --accent2:#2dd4bf; --danger:#ff5c7a; --ok:#2ecc8f;
    --border:#26304a; --soft:#1d2740; --radius:16px; --shadow:0 4px 18px rgba(0,0,0,.35);
    --safe:env(safe-area-inset-bottom);
    --up:#ff6b5e; --down:#26c281; --neutral:#7d8798; --gold:#f0a824;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit;font-size:16px;color:var(--text);caret-color:var(--accent)}
  input::placeholder{color:var(--muted)}
  .icon{width:22px;height:22px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .app{display:flex;min-height:100vh}
  .side{display:none}
  .main{flex:1;display:flex;flex-direction:column;max-width:760px;margin:0 auto;width:100%;position:relative}

  header{position:sticky;top:0;z-index:20;background:rgba(15,21,34,.88);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 7px) 14px 7px;}
  .h-top{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{font-weight:800;font-size:16px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex:none}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .h-actions{margin-left:0;display:flex;gap:4px;flex:none}
  .h-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
  .h-btn .icon{width:19px;height:19px}
  .h-btn:active{background:var(--soft)}
  .strip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:10px 16px 0}
  .strip .led{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .strip-upd{margin-left:auto;color:var(--muted)}
  .strip.off{position:fixed;left:0;right:0;bottom:0;z-index:55;gap:8px;color:#ffb0b0;
    background:#3a1622;border-top:1px solid #5e2434;font-weight:600;
    padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
  .strip.off .led{background:var(--danger)}
  .strip.off .strip-upd{display:none}

  /* 模块切换（工作台级分段控件，并入顶栏单行） */
  .switch{display:flex;gap:2px;margin-left:auto;flex:none;background:var(--soft);
    border:1px solid var(--border);border-radius:11px;padding:3px}
  .switch button{padding:6px 11px;border-radius:8px;border:none;
    background:transparent;color:var(--muted);font-size:13px;font-weight:700}
  .switch button.on{background:var(--accent);color:#fff}
  .switch button:not(.on):active{background:#253052}
  @media(max-width:379px){
    .logo{font-size:14px}
    .switch button{padding:6px 8px;font-size:12px}
  }

  .ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .ptr .spin{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%}
  .ptr.busy .spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 共享每日一言 */
  .today{margin:12px 14px 0;background:linear-gradient(135deg,#1c2540,#14282e);border:1px solid #2a3556;border-radius:var(--radius);padding:14px 16px}
  .today h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--accent)}
  .q-text{font-size:18px;font-weight:600;line-height:1.7;color:var(--text);margin:6px 2px 6px}
  .q-author{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

  .mod{display:none;flex:1;overflow-y:auto;padding:6px 14px 28px;-webkit-overflow-scrolling:touch}
  .mod.on{display:block}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin:10px 0;box-shadow:var(--shadow);transition:transform .12s}
  .card:active{transform:scale(.992)}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .c-type{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .t-deep{background:#2a1e4d;color:#c9a8ff}
  .t-news{background:#1d2740;color:var(--accent)}
  .grp-head{display:flex;align-items:center;gap:8px;margin:20px 4px 6px;font-size:15px;font-weight:800;color:var(--accent)}
  .grp-head:first-child{margin-top:6px}
  .grp-n{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:10px;padding:1px 8px}
  .c-src{font-size:12px;color:var(--muted)}
  .c-date{margin-left:auto;font-size:12px;color:var(--muted)}
  .c-title{font-size:16px;font-weight:700;margin:2px 0 6px;line-height:1.45}
  .c-sum{font-size:14px;color:#a9b3c6;line-height:1.55}
  .c-insight{margin-top:10px;padding:9px 12px;border-left:3px solid #4f46e5;background:rgba(79,70,229,.09);border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;color:#c3cae0}
  .c-insight b{color:#8b93ff;font-weight:700}
  .c-case{margin-top:8px;padding:8px 11px;background:rgba(45,212,191,.05);border:1px solid rgba(45,212,191,.22);border-radius:10px;font-size:13px;line-height:1.6;color:#c3cae0}
  .c-case b{color:#2dd4bf;font-weight:700}
  .c-case .src{display:block;margin-top:3px;font-size:11.5px;color:#7f95a0}
  .c-method{margin-top:10px;padding:10px 12px;border-left:3px solid #2dd4bf;background:rgba(45,212,191,.07);border-radius:0 8px 8px 0;font-size:13px;line-height:1.65;color:#c9d4d8}
  .c-method b{color:#2dd4bf;font-weight:700}
  .c-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .c-tag{font-size:12px;padding:3px 9px;border-radius:14px;background:var(--soft);color:#9aa5b8}
  .c-act{margin-left:auto;display:flex;gap:6px}
  .act{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--soft)}
  .act.on{color:var(--accent)}
  .read-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);display:inline-block}
  .c-cat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .cc-macro{background:rgba(59,130,246,.16);color:#7ab0ff}
  .cc-mind{background:rgba(167,139,250,.16);color:#b79bff}
  .cc-invest{background:rgba(234,179,8,.16);color:#ffd35c}
  .cc-life{background:rgba(244,114,182,.16);color:#ff9ecb}
  .cc-edu{background:rgba(45,212,191,.16);color:#5eead4}
  .cc-tech{background:rgba(99,102,241,.18);color:#9aa6ff}
  .cc-biz{background:rgba(249,115,22,.16);color:#ffa35c}
  .cc-geo{background:rgba(239,68,68,.16);color:#ff8a8a}
  .cc-society{background:rgba(20,184,166,.16);color:#5ce8d8}
  .cc-science{background:rgba(139,92,246,.16);color:#b7a3ff}
  .cc-culture{background:rgba(180,130,80,.2);color:#d8b088}
  .cc-psyche{background:rgba(219,39,119,.16);color:#ff85b3}
  .cc-career{background:rgba(6,182,212,.16);color:#67e0f4}
  .cc-law{background:rgba(100,116,139,.2);color:#a8b6cc}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:none}
  .row label{flex:1;font-size:14px}
  .row input[type=text]{flex:1;height:42px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:var(--soft);min-width:0}
  .btn{height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .gauge{display:flex;align-items:center;gap:16px}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mask{position:fixed;inset:0;background:rgba(20,24,40,.4);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(360px,88vw);background:var(--bg);z-index:50;transform:translateX(100%);transition:.25s;overflow-y:auto;padding:18px 16px calc(20px + var(--safe))}
  .drawer.show{transform:none}
  .drawer h2{margin:6px 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
  .drawer .close{position:absolute;right:14px;top:16px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
  .drawer .close:active{background:var(--soft)}

  /* ===== 财经简报模块样式（工作台风格） ===== */
  .fin-actions{display:flex;gap:7px;margin:12px 2px 0}
  .fin-act{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;
    background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:700}
  .fin-act:active{background:var(--soft)}
  .mkt{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:10px 0 4px;overflow:hidden}
  .mkt-grp{border-top:1px solid var(--border)}
  .mkt-grp:first-child{border-top:none}
  .mkt-hd{display:flex;align-items:center;gap:7px;padding:11px 12px;cursor:pointer}
  .mkt-hd .bar{width:3px;height:14px;border-radius:2px;flex:none}
  .mkt-hd .t{font-size:13.5px;font-weight:800;color:var(--text);letter-spacing:.5px}
  .mkt-hd .ar{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(-45deg);transition:transform .2s ease;margin-left:auto;flex:none}
  .mkt-grp.open .mkt-hd .ar{transform:rotate(45deg)}
  .mkt-bd{display:none;padding:0 0 10px}
  .mkt-grp.open .mkt-bd{display:block}
  .mkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 12px}
  .mkt-grid.cols2{grid-template-columns:repeat(2,1fr)}
  .mkt-card{background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .mkt-card .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mkt-card .vl{font-weight:700;font-size:14.5px;color:var(--text);line-height:1.15;white-space:nowrap}
  .mkt-card .ch{font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:2px;white-space:nowrap}
  .fin-sec{padding:14px 0 2px}
  .fin-sec-h{display:flex;align-items:center;gap:7px;padding:0 4px 8px}
  .fin-sec-h .bar{width:3px;height:14px;border-radius:2px;background:var(--gold)}
  .fin-sec-h.op .bar{background:var(--ok)}
  .fin-sec-h.rk .bar{background:var(--danger)}
  .fin-sec-h .t{font-size:13.5px;font-weight:800;color:var(--text);letter-spacing:.5px}
  .fin-sec-h .cnt{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    padding:0 7px;border-radius:9px;line-height:18px}
  .fin-sec-h.op .cnt{background:var(--ok)} .fin-sec-h.rk .cnt{background:var(--danger)}
  .fin-sec-h{cursor:pointer;user-select:none}
  .fin-sec-h .ar{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(45deg);transition:transform .2s ease;margin-left:auto;flex:none}
  .fin-sec.collapsed .fin-sec-h .ar{transform:rotate(-45deg)}
  .fin-sec.collapsed #finLead,
  .fin-sec.collapsed #finOppo,
  .fin-sec.collapsed #finRisk{display:none}
  .fin-lead{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .lead-item{position:relative;padding:10px 12px 10px 34px;border-top:1px solid var(--border);background:var(--card)}
  .lead-item:first-child{border-top:none}
  .lead-item .rk{position:absolute;left:11px;top:11px;width:18px;height:18px;border-radius:50%;
    background:linear-gradient(135deg,#f6c560,#f0a824);color:#3d2a00;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .lead-item .row1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .lead-item .cat{font-size:10.5px;font-weight:700;color:#9db4ff;background:#232f55;padding:1px 6px;border-radius:5px}
  .lead-item .stars{display:inline-flex;gap:1px}
  .st{width:12px;height:12px;display:block}
  .lead-item h3{margin:0 0 3px;font-size:14.5px;font-weight:700;line-height:1.42;color:var(--text)}
  .lead-item p{margin:0;font-size:12.5px;color:#a9b3c6;line-height:1.55}
  .fin-advice{position:relative;padding:10px 12px;border-top:1px solid var(--border);background:var(--card)}
  .fin-advice:first-child{border-top:none}
  .fin-advice.oppo{box-shadow:inset 3px 0 0 var(--ok)}
  .fin-advice.risk{box-shadow:inset 3px 0 0 var(--danger)}
  .fin-advice .row1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .fin-advice .tag{font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px;flex:none}
  .fin-advice.oppo .tag{background:#123524;color:#2ecc8f}
  .fin-advice.risk .tag{background:#3a1620;color:#ff5c7a}
  .fin-advice h3{margin:0 0 3px;font-size:14px;font-weight:700;line-height:1.42;color:var(--text)}
  .fin-advice p{margin:0 0 6px;font-size:12.5px;color:#a9b3c6;line-height:1.55}
  .fin-advice .kw{display:flex;flex-wrap:wrap;gap:5px}
  .fin-advice .meta{font-size:11px;color:var(--muted);margin-top:5px}
  .fin-feed{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .fin-item{background:var(--card);padding:10px 12px;border-top:1px solid var(--border)}
  .fin-item:first-child{border-top:none}
  .fin-item .row1{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .fin-item .cat{font-size:10.5px;font-weight:700;color:#9db4ff;background:#232f55;padding:1px 6px;border-radius:5px;flex:none}
  .fin-item .stars{display:inline-flex;gap:1px;flex:none;margin-left:auto}
  .fin-item h3{margin:1px 0 4px;font-size:14.5px;font-weight:700;line-height:1.42;color:var(--text)}
  .fin-item p{margin:0 0 7px;font-size:13px;color:#a9b3c6;line-height:1.55}
  .fin-item .kw{display:flex;flex-wrap:wrap;gap:5px}
  .fin-item .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:6px}
  .fin-item .meta .src{font-weight:600;color:#8fa0bb}
  .fin-chip{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--soft);color:#9aa5b8}
  .fin-chip.s-up{background:#3a1620;color:#ff6b5e;font-weight:700}
  .fin-chip.s-down{background:#123524;color:#26c281;font-weight:700}
  .fin-chip.s-flat{background:#1d2740;color:var(--neutral);font-weight:700}
  .fin-note{font-size:11px;color:var(--muted);padding:2px 4px 0}
  #mod-fin.comfy .fin-item{padding:12px 14px}
  #mod-fin.comfy .fin-item p{font-size:13.5px}
  #mod-fin.comfy .lead-item{padding:12px 14px 12px 38px}
  #mod-fin.comfy .fin-advice{padding:12px 14px}

  @media(min-width:880px){
    .side{display:flex;flex-direction:column;width:230px;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh}
    .side .logo{font-size:19px;margin-bottom:6px;padding-left:6px}
    .side .s-sub{font-size:12px;color:var(--muted);padding:0 8px 14px;line-height:1.6}
    .side .s-upd{color:var(--accent)}
    .side .s-foot{margin-top:auto;padding:10px 8px 0;font-size:11px;color:var(--muted)}
    header{position:static}
    .mod{min-height:60vh}
    .today,.mod{margin-left:22px;margin-right:22px}
  }
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot"></span>深度资讯</div>
    <div class="s-sub">认知差 · 信息差 · 财经盘面，一个入口每日更新<span class="s-upd" id="updateTime"></span></div>
    <div class="s-foot">数据本地存储 · 下拉刷新获取最新</div>
  </aside>

  <div class="main">
    <header>
      <div class="h-top">
        <div class="logo"><span class="dot"></span><span>深度资讯</span></div>
        <div class="switch">
          <button data-m="cog" class="on">认知简讯</button>
          <button data-m="fin">财经简报</button>
        </div>
        <div class="h-actions">
          <button class="h-btn" id="refreshBtn" title="刷新"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg></button>
          <button class="h-btn" id="setBtn" title="设置"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg></button>
        </div>
      </div>
    </header>

    <!-- 状态条：不吸顶，随内容滚动；仅离线时转为底部固定红色横幅 -->
    <div class="strip" id="statusStrip"><span class="led"></span><span id="statusTxt">正在连接…</span><span class="strip-upd" id="updateTimeMob"></span></div>

    <div class="ptr" id="ptr"><div class="spin"></div></div>

    <!-- 模块 A：认知简讯（每日一言仅在此模块显示） -->
    <div class="mod on" id="mod-cog">
      <div id="quoteBox"></div>
      <div class="view" id="view" style="padding:0"></div>
    </div>

    <!-- 模块 B：财经简报 -->
    <div class="mod" id="mod-fin">
      <div class="fin-actions">
        <button class="fin-act" id="densBtn" title="切换密度"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg><span>密度</span></button>
        <button class="fin-act" id="finExpBtn" title="导出 JSON 备份"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>备份</span></button>
        <button class="fin-act" id="finImpBtn" title="导入恢复 JSON"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>导入</span></button>
        <input type="file" id="finFileIn" class="hidden" accept="application/json,.json">
      </div>
      <div class="mkt" id="finMkt"></div>
      <section class="fin-sec">

async function fetchCog(force){
  const st=settings();

  const seen=new Set();
  const tryList=[(st.dataUrl&&st.dataUrl.trim()),REMOTE_BASE+'data.json',REMOTE_RAW+'data.json','./data.json']
    .filter(u=>{ if(!u||seen.has(u)) return false; seen.add(u); return true; });
  for(const url of tryList){
    try{
      const res=await fetch(url,{cache:'no-store',headers:{'Accept':'application/json'}});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json=await res.json();
      localStorage.setItem(K.cache,JSON.stringify(json)); localStorage.setItem(K.cacheTime,String(Date.now()));
      COG.lastFetch=Date.now(); return {data:json,src:'live'};
    }catch(e){}

}

function finSentClass(s){ return s==="利好"?"s-up":s==="利空"?"s-down":"s-flat"; }
function arrow(d){
  if(d===1) return '<svg class="ar" viewBox="0 0 10 10" style="width:7px;height:7px"><path d="M5 1 L9 8 L1 8 Z" fill="#ff6b5e"/></svg>';
  if(d===-1) return '<svg class="ar" viewBox="0 0 10 10" style="width:7px;height:7px"><path d="M5 9 L1 2 L9 2 Z" fill="#26c281"/></svg>';
  return '<svg class="ar" viewBox="0 0 10 10" style="width:7px;height:7px"><path d="M1 5h8" stroke="#7d8798" stroke-width="1.6"/></svg>';
}
function finChips(it){
  const sc=`<span class="fin-chip ${finSentClass(it.sent)}">${it.sent}</span>`;
  const kw=(it.kw||[]).map(k=>'<span class="fin-chip">'+k+'</span>').join('');
  return sc+kw;
}
function finItemHTML(it){
  return `<article class="fin-item">
    <div class="row1"><span class="cat">${it.cat}</span><span class="stars">${stars(it.prio)}</span></div>
    <h3>${it.title}</h3>
    <p>${it.sum}</p>
    <div class="kw">${finChips(it)}</div>
    <div class="meta"><span class="src">${it.src}</span><span>${it.time}</span></div>
  </article>`;
}
function finAdviceHTML(it,kind){
  const tag=kind==="oppo"?"机会":"风险";
  const kw=(it.kw||[]).map(k=>'<span class="fin-chip">'+k+'</span>').join('');
  return `<div class="fin-advice ${kind}">
    <div class="row1"><span class="tag">${tag}</span></div>
    <h3>${it.title}</h3>
    <p>${it.sum}</p>
    <div class="kw">${kw}</div>
    <div class="meta">来源：${it.src}</div>
  </div>`;
}
function renderFinMarket(tk){
  let groups=[],cur=null;
  (tk||[]).forEach(t=>{ if(t.g){cur={name:t.g,color:t.c,items:[]};groups.push(cur);} else if(cur) cur.items.push(t); });
  const html=groups.map((g,gi)=>{
    const open=gi===0?"open":"";
    const cards=g.items.map(t=>{
      const cls=t.flat?'flat':(t.d===1?'up':(t.d===-1?'down':'flat'));
      const val=t.v?`<span class="vl">${t.v}</span>`:'';
      const ch=t.flat?`<span class="ch ${cls}">${t.c}</span>`:`<span class="ch ${cls}">${arrow(t.d)}${t.c}</span>`;
      return `<div class="mkt-card"><span class="nm">${t.nm}</span>${val}${ch}</div>`;
    }).join('');
    const gridCls=g.items.length===4?"mkt-grid cols2":"mkt-grid";
    return `<div class="mkt-grp ${open}"><div class="mkt-hd"><span class="bar" style="background:${g.color}"></span><span class="t">${g.name}</span><span class="ar"></span></div><div class="mkt-bd"><div class="${gridCls}">${cards}</div></div></div>`;
  }).join('');
  const m=document.getElementById('finMkt');
  m.innerHTML=html||'<span class="fin-note" style="padding:10px 12px">行情暂不可用</span>';
  m.querySelectorAll('.mkt-hd').forEach(hd=>hd.onclick=()=>hd.parentElement.classList.toggle('open'));
}
function bindFinSectionFold(){
  document.querySelectorAll('#mod-fin .fin-sec-h').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('collapsed');
  });
}
function renderFin(){
  const d=FIN.data||SEED_FIN;
  renderFinMarket(d.ticker);
  const news=(d.news||[]).slice().sort((a,b)=>(b.prio||1)-(a.prio||1));
  document.getElementById('finLeadCnt').textContent=news.length;
  document.getElementById('finLead').innerHTML = news.length ? ('<div class="fin-feed">'+news.map((it,idx)=>{
    if((it.prio||1)===3){
      return `<div class="lead-item"><span class="rk">${idx+1}</span>
        <div class="row1"><span class="cat">${it.cat||''}</span><span class="stars">${stars(3)}</span></div>
        <h3>${it.title}</h3><p>${it.sum}</p></div>`;
    }
    return finItemHTML(it);
  }).join('')+'</div>') : '<div class="empty">暂无资讯</div>';
  const oppo=d.opportunities||[], risk=d.risks||[];
  document.getElementById('finOpCnt').textContent=oppo.length;
  document.getElementById('finOppo').innerHTML=oppo.length?('<div class="fin-lead">'+oppo.map(it=>finAdviceHTML(it,'oppo')).join('')+'</div>'):'<div class="empty">暂无机会</div>';
  document.getElementById('finRkCnt').textContent=risk.length;
  document.getElementById('finRisk').innerHTML=risk.length?('<div class="fin-lead">'+risk.map(it=>finAdviceHTML(it,'risk')).join('')+'</div>'):'<div class="empty">暂无风险</div>';
  document.getElementById('finNote').textContent='财经简报数据日期：'+ (d.date||'—') + '（由 fin.json 提供）';
}
function setFinDensity(d){
  const mod=document.getElementById('mod-fin');
  mod.classList.toggle('comfy',d==='comfy');
  document.getElementById('densBtn').classList.toggle('on',d==='comfy');
  try{localStorage.setItem(FIN_DKEY,d);}catch(e){}
}
document.getElementById('densBtn').onclick=()=>{
  const cur=document.getElementById('mod-fin').classList.contains('comfy')?'comfy':'compact';
  setFinDensity(cur==='comfy'?'compact':'comfy');
};
function finExport(){
  const d=FIN.data||SEED_FIN;
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='财经简报_'+(d.date||'data')+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('已导出 '+((d.news||[]).length)+' 条资讯');
}
document.getElementById('finExpBtn').onclick=finExport;
document.getElementById('finImpBtn').onclick=()=>document.getElementById('finFileIn').click();
document.getElementById('finFileIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const news=(d&&Array.isArray(d.news))?d.news:null;
      if(!news||!news.length){toast('文件无有效资讯数据');return;}
      FIN.data=d;renderFin();toast('导入成功，共 '+news.length+' 条');
    }catch(err){toast('解析失败：文件格式不正确');}
  };
  rd.readAsText(f);e.target.value='';
};

/* ===== 模块切换 ===== */
function setModule(m){
  currentMod=m;
  try{ localStorage.setItem('wb_info_mod',m); }catch(e){}
  document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('mod-cog').classList.toggle('on',m==='cog');
  document.getElementById('mod-fin').classList.toggle('on',m==='fin');
}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>setModule(b.dataset.m));

/* ===== 状态条 ===== */
function updateStatus(){
  const el=document.getElementById('statusStrip'),txt=document.getElementById('statusTxt');
  if(!el||!txt)return;
  el.classList.toggle('off',!COG.online);
  txt.textContent=COG.online?'已连接':'离线模式 · 显示已缓存内容';
}

/* ===== 刷新（按当前模块） ===== */
async function doRefresh(){
  document.getElementById('ptr').classList.add('busy');
  if(currentMod==='cog'){
    const r=await fetchCog(true); COG.data=r.data; COG.online=navigator.onLine;
    renderCog(); renderStat(); setUpdateTime(); updateStatus();
    toast(r.src==='live'?'认知简讯已更新':(r.src==='cache'?'已读取本地缓存':'示例数据（无网络/无数据源）'));
  }else{
    const r=await fetchFin(true); FIN.data=r.data;
    renderFin();
    toast(r.src==='live'?'财经简报已更新':(r.src==='cache'?'已读取本地缓存':'fin.json 暂不可用'));
  }
  document.getElementById('ptr').classList.remove('busy');
}
document.getElementById('refreshBtn').onclick=doRefresh;

/* ===== 模块容器滚动/下拉刷新 ===== */
document.querySelectorAll('.mod').forEach(m=>{
  let startY=0,pull=0,pulling=false;
  m.addEventListener('touchstart',e=>{ if(m.scrollTop<=0){ startY=e.touches[0].clientY; pulling=true; } },{passive:true});
  m.addEventListener('touchmove',e=>{ if(!pulling)return; const dy=e.touches[0].clientY-startY; if(dy>0&&m.scrollTop<=0){ pull=Math.min(dy*0.5,80); document.getElementById('ptr').style.height=pull+'px'; } },{passive:true});
  m.addEventListener('touchend',()=>{ if(!pulling)return; pulling=false; if(pull>56) doRefresh(); document.getElementById('ptr').style.height='0'; pull=0; });
});

/* ===== 已读交互（仅认知简讯） ===== */
function toggleRead(id){ if(READ.has(id)) READ.delete(id); else READ.add(id); saveRead(); renderCog(); renderStat(); }
view.addEventListener('click',e=>{ const btn=e.target.closest('[data-act]'); if(btn){ e.stopPropagation(); if(btn.dataset.act==='read') toggleRead(btn.dataset.id); } });

/* ===== 设置抽屉 ===== */
const drawer=document.getElementById('drawer'),mask=document.getElementById('mask');
function openDrawer(){ drawer.classList.add('show'); mask.classList.add('show'); document.getElementById('dataUrl').value=(settings().dataUrl||''); renderStat(); }
function closeDrawer(){ drawer.classList.remove('show'); mask.classList.remove('show'); }
document.getElementById('setBtn').onclick=openDrawer;
document.getElementById('drawerClose').onclick=closeDrawer;
mask.onclick=closeDrawer;
document.getElementById('saveUrl').onclick=()=>{ const s=settings(); s.dataUrl=document.getElementById('dataUrl').value.trim(); saveSettings(s); toast('已保存，正在刷新'); setModule('cog'); doRefresh(); closeDrawer(); };

/* ===== toast / 在线 ===== */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
window.addEventListener('online',()=>{ COG.online=true; updateStatus(); doRefresh(); });
window.addEventListener('offline',()=>{ COG.online=false; updateStatus(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(currentMod==='cog'&&Date.now()-COG.lastFetch>300000) doRefresh(); else if(currentMod==='fin'&&Date.now()-FIN.lastFetch>300000) doRefresh(); } });

/* ===== 启动 ===== */
load();
renderQuote();
bindFinSectionFold();
COG.online=navigator.onLine; updateStatus();
let savedMod='cog'; try{ savedMod=localStorage.getItem('wb_info_mod')||'cog'; }catch(e){}
if(savedMod!=='cog'&&savedMod!=='fin') savedMod='cog';
if(savedMod!=='cog') setModule(savedMod);
let savedFinDensity='compact'; try{ savedFinDensity=localStorage.getItem(FIN_DKEY)||'compact'; }catch(e){}
if(savedFinDensity!=='compact'&&savedFinDensity!=='comfy') savedFinDensity='compact';
if(savedFinDensity==='comfy') setFinDensity('comfy');
fetchCog(false).then(r=>{ COG.data=r.data; COG.lastFetch=(r.src==='live'||r.src==='cache')?Number(localStorage.getItem(K.cacheTime)||Date.now()):0; renderCog(); renderStat(); setUpdateTime(); });
fetchFin(false).then(r=>{ FIN.data=r.data; FIN.lastFetch=(r.src==='live'||r.src==='cache')?Number(localStorage.getItem(K.finTime)||Date.now()):0; renderFin(); });
</script>
</body>
</html>
